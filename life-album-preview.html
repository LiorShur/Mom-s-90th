<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>Life album preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Frank+Ruhl+Libre:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#6b6258; color:#fff; font-family:sans-serif; }
  .label { text-align:center; padding:12px; }
  .scaler { transform:scale(0.6); transform-origin:top center; height:700px; }

  .book { --bk-paper:#fbf6ec; --bk-ink:#2b2622; --bk-soft:#7a7065; --bk-accent:#9c5b3b;
    --bk-body:"Newsreader","Frank Ruhl Libre",Georgia,serif;
    --bk-name:"Fraunces","Frank Ruhl Libre",Georgia,serif; }
  .book-page { width:30cm; height:30cm; position:relative; overflow:hidden; background:var(--bk-paper); color:var(--bk-ink); }

  .life-page { display:flex; flex-direction:column; padding:2cm; }
  .life-head { text-align:center; margin-bottom:.8cm; }
  .ft-kicker { font-family:var(--bk-body); font-style:italic; color:var(--bk-accent); margin:0; font-size:1.1rem; }
  .life-title { font-family:var(--bk-name); font-weight:500; font-size:2.8rem; margin:.2cm 0 0; color:var(--bk-ink); }
  .life-grid { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:1cm 1.2cm; align-content:center; }
  .life-card { display:flex; flex-direction:column; align-items:center; }
  .life-photo { width:100%; aspect-ratio:4/5; background:#fff; padding:.3cm; box-shadow:0 .12cm .5cm rgba(40,30,20,.22); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .life-photo img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  figcaption { font-family:var(--bk-body); font-size:1rem; color:var(--bk-soft); margin-top:.35cm; text-align:center; line-height:1.3; }
  .life-year { font-family:var(--bk-name); color:var(--bk-accent); font-weight:500; margin-inline-end:.25em; }
</style>
</head>
<body>
  <div class="label">"מרים לאורך השנים" — every photo shown <b>whole</b> on a white mat, year + caption beneath, auto-sorted by year. (Placeholders here; your real vintage prints will look far lovelier.)</div>
  <div class="scaler">
    <section class="book book-page life-page">
      <div class="life-head">
        <p class="ft-kicker">לכבוד יום ההולדת ה-90 של מרים</p>
        <h2 class="life-title">מרים לאורך השנים</h2>
      </div>
      <div class="life-grid">
        <figure class="life-card"><div class="life-photo"><img src="https://picsum.photos/seed/b1/800/950?grayscale" alt=""></div><figcaption><span class="life-year">1936</span> נולדה בתל אביב</figcaption></figure>
        <figure class="life-card"><div class="life-photo"><img src="https://picsum.photos/seed/b2/800/800?grayscale" alt=""></div><figcaption><span class="life-year">1940</span> הילדה הקטנה</figcaption></figure>
        <figure class="life-card"><div class="life-photo"><img src="https://picsum.photos/seed/b3/950/650?grayscale" alt=""></div><figcaption><span class="life-year">1955</span> עם החברות</figcaption></figure>
        <figure class="life-card"><div class="life-photo"><img src="https://picsum.photos/seed/b4/700/950?grayscale" alt=""></div><figcaption><span class="life-year">1957</span> הכלה</figcaption></figure>
        <figure class="life-card"><div class="life-photo"><img src="https://picsum.photos/seed/b5/900/650?grayscale" alt=""></div><figcaption><span class="life-year">1972</span> המשפחה ליד החיפושית</figcaption></figure>
        <figure class="life-card"><div class="life-photo"><img src="https://picsum.photos/seed/b6/800/900" alt=""></div><figcaption><span class="life-year">2024</span> מרים ויעקב היום</figcaption></figure>
      </div>
    </section>
  </div>
</body>
</html>
