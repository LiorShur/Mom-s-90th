<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>Family tree preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Frank+Ruhl+Libre:wght@400;500&family=Gveret+Levin&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Parisienne&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #6b6258; font-family: sans-serif; color: #fff; }
  .label { text-align: center; padding: 12px; }
  .scaler { transform: scale(0.62); transform-origin: top center; height: 720px; }

  .book { --bk-paper:#fbf6ec; --bk-ink:#2b2622; --bk-soft:#7a7065; --bk-accent:#9c5b3b;
    --bk-body:"Newsreader","Frank Ruhl Libre",Georgia,serif;
    --bk-name:"Fraunces","Frank Ruhl Libre",Georgia,serif;
    --bk-script:"Parisienne","Gveret Levin",cursive; }
  .book-page { width:30cm; height:30cm; position:relative; overflow:hidden; background:var(--bk-paper); color:var(--bk-ink); }

  .family-tree .ft-bg { position:absolute; inset:0; width:100%; height:100%; }
  .family-tree .ft-content { position:relative; height:100%; display:flex; flex-direction:column; align-items:center; text-align:center; padding:2.4cm 2cm; }
  .family-tree .ft-kicker { font-family:var(--bk-body); font-style:italic; color:var(--bk-accent); margin:0; font-size:1.1rem; }
  .family-tree .ft-title { font-family:var(--bk-name); font-weight:500; font-size:2.9rem; margin:.3cm 0 0; color:var(--bk-ink); }
  .family-tree .ft-names { flex:1; display:flex; flex-wrap:wrap; gap:.4cm .9cm; justify-content:center; align-content:center; max-width:24cm; padding:.8cm 0; }
  .family-tree .ft-leaf { font-family:var(--bk-body); font-size:1.5rem; color:var(--bk-ink); white-space:nowrap; }
  .family-tree .ft-honoree { font-family:var(--bk-script); font-size:3.6rem; color:var(--bk-accent); line-height:1; }
</style>
</head>
<body>
  <div class="label">Family-tree opening page (sample names) — Miriam at the root, the whole family in the canopy. The real page auto-fills with your approved submissions.</div>
  <div class="scaler">
    <section class="book book-page family-tree">
      <svg class="ft-bg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path d="M47.5 100 C49 82 46.5 70 49 60 L51 60 C53.5 70 51 82 52.5 100 Z" fill="#9c7b53" />
        <g stroke="#9c7b53" stroke-width="1.3" fill="none" stroke-linecap="round">
          <path d="M50 61 C40 56 30 55 21 47" /><path d="M50 61 C60 56 70 55 79 47" />
          <path d="M50 59 C46 51 44 45 44 36" /><path d="M50 59 C54 51 56 45 56 36" />
          <path d="M50 60 C39 55 30 52 22 57" /><path d="M50 60 C61 55 70 52 78 57" />
        </g>
        <g fill="#a9bf95">
          <ellipse cx="50" cy="30" rx="41" ry="27" opacity="0.40" />
          <ellipse cx="26" cy="40" rx="21" ry="17" opacity="0.45" />
          <ellipse cx="74" cy="40" rx="21" ry="17" opacity="0.45" />
          <ellipse cx="50" cy="17" rx="27" ry="15" opacity="0.45" />
          <ellipse cx="37" cy="25" rx="19" ry="15" opacity="0.38" />
          <ellipse cx="63" cy="25" rx="19" ry="15" opacity="0.38" />
        </g>
      </svg>
      <div class="ft-content">
        <div class="ft-head">
          <p class="ft-kicker">לכבוד יום ההולדת ה-90 של מרים</p>
          <h2 class="ft-title">האילן המשפחתי שלנו</h2>
        </div>
        <div class="ft-names">
          <span class="ft-leaf">שמוליק</span><span class="ft-leaf">רותי</span><span class="ft-leaf">דוד</span>
          <span class="ft-leaf">מיכל</span><span class="ft-leaf">יוסי</span><span class="ft-leaf">תמר</span>
          <span class="ft-leaf">אבי</span><span class="ft-leaf">נועה</span><span class="ft-leaf">איתי</span>
          <span class="ft-leaf">שירה</span><span class="ft-leaf">דניאל</span><span class="ft-leaf">יעל</span>
          <span class="ft-leaf">עומר</span><span class="ft-leaf">ליאור</span><span class="ft-leaf">מאיה</span>
          <span class="ft-leaf">גיא</span><span class="ft-leaf">רוני</span><span class="ft-leaf">טל</span>
          <span class="ft-leaf">אלה</span><span class="ft-leaf">נגה</span><span class="ft-leaf">איתמר</span>
        </div>
        <div class="ft-honoree">מרים</div>
      </div>
    </section>
  </div>
</body>
</html>
